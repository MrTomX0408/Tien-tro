<script>
function calc() {
  let room = document.getElementById('roomName').value;
  let rPrice = parseFloat(document.getElementById('roomPrice').value)||0;
  let eOld = parseFloat(document.getElementById('elecOld').value)||0;
  let eNew = parseFloat(document.getElementById('elecNew').value)||0;
  let ePrice = parseFloat(document.getElementById('elecPrice').value)||0;
  let eUsed = Math.max(0, eNew - eOld);
  let eTot = eUsed * ePrice;
  let ppl = parseFloat(document.getElementById('people').value)||1;
  let wPrice = parseFloat(document.getElementById('waterPrice').value)||0;
  let wTot = wPrice * ppl;
  let wash = (parseFloat(document.getElementById('washPrice').value)||0)*ppl;
  let wifi = parseFloat(document.getElementById('wifiPrice').value)||0;
  let total = rPrice + eTot + wTot + wash + wifi;

  document.getElementById('grandTotal').innerText = total.toLocaleString('vi-VN') + ' đ';

  let msg = `🏠 HOÁ ĐƠN TIỀN TRỌ - ${room.toUpperCase()}\n`;
  msg += `----------------------------------\n`;
  msg += `1. Tiền phòng: ${rPrice.toLocaleString('vi-VN')}đ\n`;
  msg += `2. Tiền điện (${eUsed} số × ${ePrice.toLocaleString('vi-VN')}đ): ${eTot.toLocaleString('vi-VN')}đ\n`;
  msg += `3. Tiền nước (${ppl} người × ${wPrice.toLocaleString('vi-VN')}đ): ${wTot.toLocaleString('vi-VN')}đ\n`;
  if(wash > 0) msg += `4. Máy giặt (${ppl} người): ${wash.toLocaleString('vi-VN')}đ\n`;
  if(wifi > 0) msg += `5. Mạng & Vệ sinh: ${wifi.toLocaleString('vi-VN')}đ\n`;
  msg += `----------------------------------\n`;
  msg += `👉 TỔNG CỘNG: ${total.toLocaleString('vi-VN')}đ\n`;
  msg += `💳 CK: TPBank - 4469 6295 888 - NGUYEN THI CHUC`;

  document.getElementById('zaloPreview').innerText = msg;
}
document.querySelectorAll('input').forEach(i => i.addEventListener('input', calc));
calc();

function copyZalo() {
  navigator.clipboard.writeText(document.getElementById('zaloPreview').innerText);
  alert('✅ Đã copy tin nhắn Zalo!');
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
